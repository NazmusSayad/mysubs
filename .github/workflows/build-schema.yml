name: Build and Deploy JSON Schema

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Build JSON schema
        run: pnpm exec tsx ./src/json.ts

      - name: Force checkout schema branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git fetch origin
          git checkout -B schema origin/main

      - name: Commit and push schema
        run: |
          git add -f schema.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: build JSON schema from main"
            git push -f origin schema
          else
            echo "No changes to commit"
          fi
